name: NPM Publish

on:
  push:
    branches:
      - main

jobs:
  release:
    permissions:
      contents: write
      issues: write
      pull-requests: write
      # npm trusted publishing (OIDC): no NPM_TOKEN. Each package lists this
      # repository and workflow as its trusted publisher on npmjs.com.
      id-token: write

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5

      # Node 24 ships npm 11, which trusted publishing needs (11.5.1+).
      - name: Setup Node.js 24.x
        uses: actions/setup-node@v5
        with:
          node-version: 24.x

      - name: npm install
        run: npm ci
        env:
          CI: true

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v2
        with:
          version-script: npm run version
          publish-script: npm run publish-packages
